name: release
on:
  push:
    tags:
      - "v*"

env:
  BIN_NAME: calculator-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install MUSL tools (linux-aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
      - name: Archive artifacts
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            7z a "${{ env.BIN_NAME }}-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe"
            echo "ARTIFACT_PATH=${{ env.BIN_NAME }}-${{ matrix.target }}.zip" >> $GITHUB_ENV
          else
            tar -czf "${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ env.BIN_NAME }}"
            echo "ARTIFACT_PATH=${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.ARTIFACT_PATH }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build macOS universal binary
        run: |
          cargo build --target x86_64-apple-darwin --release
          cargo build --target aarch64-apple-darwin --release
          lipo -create -output "${{ env.BIN_NAME }}" "target/x86_64-apple-darwin/release/${{ env.BIN_NAME }}" "target/aarch64-apple-darwin/release/${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
      - name: Archive macOS artifact
        run: |
          tar -czf "${{ env.BIN_NAME }}-universal.tar.gz" "${{ env.BIN_NAME }}"
          echo "ARTIFACT_PATH=${{ env.BIN_NAME }}-universal.tar.gz" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-universal
          path: ${{ env.ARTIFACT_PATH }}

  publish:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
          body: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes.
          prerelease: false