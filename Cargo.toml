[package]
name = "calculator-mcp-server"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A server for complex mathematical calculations (MCP, single binary)"

[dependencies]
rmcp = { version = "3.0", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
fasteval = "0.2"
statrs = "0.19"
nalgebra = "0.35"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symb_anafis = "0.8"
thales = "0.4"
mathcore = "0.3"
mathhook-core = "0.2"
base64 = "0.22"
image = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true